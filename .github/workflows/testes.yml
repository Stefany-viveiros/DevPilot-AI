name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Testes do backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r backend/requirements.txt
      - name: Verificar JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validar sintaxe do painel
        run: node --check frontend/assets/js/app.js
      - name: Construir imagem isolada de testes
        run: docker build -t devpilot-sandbox:py311 sandbox/
      - name: Executar testes
        working-directory: backend
        run: pytest -q
